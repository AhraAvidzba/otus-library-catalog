<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Book #' + ${book.id}">Book</title>

    <style>
        /* ✅ главное: чтобы width:100% не вылезало из-за padding/border */
        *, *::before, *::after { box-sizing: border-box; }

        body {
          font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
          margin: 20px;
        }

        .muted { color: #666; }

        .btn {
          cursor: pointer;
          padding: 6px 10px;
          border: 1px solid #888;
          background: #f7f7f7;
          border-radius: 8px;
        }

        .btn-link {
          border: none;
          background: none;
          padding: 0;
          color: #0b62d6;
          cursor: pointer;
        }

        .card {
          border: 1px solid #ddd;
          border-radius: 10px;
          padding: 12px;
          min-width: 0; /* ✅ для flex-детей */
        }

        input, select, textarea {
          padding: 6px 8px;
          border-radius: 8px;
          border: 1px solid #bbb;
          width: 100%;
          max-width: 100%;
        }

        input:focus, select:focus, textarea:focus {
          outline-offset: 0;
        }

        table {
          border-collapse: collapse;
          width: 100%;
          table-layout: fixed; /* ✅ чтобы длинный текст не раздвигал таблицу */
        }

        th, td {
          border-bottom: 1px solid #ddd;
          padding: 8px;
          vertical-align: top;
        }

        th { text-align: left; }

        .row {
          display: flex;
          gap: 16px;
          flex-wrap: wrap;
        }

        /* ✅ фиксы переполнения */
        h1 {
          word-break: break-word;
          overflow-wrap: anywhere;
        }

        .comment-text {
          white-space: normal;
          word-break: break-word;
          overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

<p><a href="/books" class="btn-link">← Back to books</a></p>

<div class="card">
    <h1 th:text="${book.title}">Book title</h1>
    <p class="muted">Id: <span th:text="${book.id}"></span></p>
    <p>Author: <strong th:text="${book.authorFullName}">Author</strong></p>
    <p>Genres: <span th:text="${#strings.listJoin(book.genres, ', ')}"></span></p>

    <div style="margin-top: 10px;">
        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" style="display:inline;">
            <button class="btn" type="submit">Delete book</button>
        </form>
        &nbsp;
        <a class="btn-link" th:href="@{/books/{id}/edit(id=${book.id})}">Edit book</a>
    </div>
</div>

<div class="row" style="margin-top: 16px;">
    <div class="card" style="flex: 1; min-width: 320px;">
        <h2>Add comment</h2>
        <form th:action="@{/comments}" method="post" th:object="${newComment}">
            <input type="hidden" th:field="*{bookId}"/>
            <div style="margin-bottom: 10px;">
                <label>Text</label><br/>
                <input type="text" th:field="*{text}" placeholder="Comment text" required/>
            </div>
            <button class="btn" type="submit">Add</button>
        </form>
    </div>

    <div class="card" style="flex: 2; min-width: 520px;">
        <h2>Comments</h2>
        <table>
            <thead>
            <tr>
                <th style="width: 80px;">Id</th>
                <th>Text</th>
                <th style="width: 140px;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${comments}">
                <td th:text="${c.id}"></td>
                <td class="comment-text" th:text="${c.text}"></td>
                <td>
                    <form th:action="@{/comments/{id}/delete(id=${c.id})}" method="post" style="display:inline;">
                        <button class="btn" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
