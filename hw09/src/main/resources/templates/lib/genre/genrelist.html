<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('genres', ~{::section})}">
<section>

  <header>
      <h1 style="font-size:20px;font-weight:700;">Genres</h1>
      <nav class="actions">
          <a class="btn btn-primary" th:href="@{/genres/create}">Add genre</a>
      </nav>
  </header>

  <div class="card" th:if="${#lists.isEmpty(genres)}">
    <div class="muted">No genres yet.</div>
    <a class="btn btn-primary" th:href="@{/genres/create}">Create first genre</a>
  </div>

    <table th:if="${!#lists.isEmpty(genres)}">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
        <th class="col-actions">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="g : ${genres}">
      <td th:text="${g.id}">id</td>
      <td th:text="${g.name}">author</td>
      <td class="col-actions">
        <div class="actions">
            <a class="btn" th:href="@{/genres/{id}/edit(id=${g.id})}">Edit</a>
            <form th:action="@{/genres/{id}/delete(id=${g.id})}" method="post">
                <button class="btn btn-danger" type="submit">Delete</button>
            </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</section>
</html>
